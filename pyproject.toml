[project]
name = "cuttoad"
version = "0.1.0"
description = "Hyper-personalized product placement ad generator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "awscli>=1.44.44",
    "ddtrace>=4.4.0",
    "jsonschema>=4.25.1",
    "loguru>=0.7.3",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "strands-agents>=1.27.0",
]

[project.scripts]
cuttoad = "cuttoad.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuttoad*"]
exclude = ["output*"]

[tool.uv]
package = true
